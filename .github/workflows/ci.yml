name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    frontend:
        name: Frontend lint / tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18.x]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 10

            - name: Ensure pnpm available (fallback)
              run: |
                  if ! command -v pnpm >/dev/null 2>&1; then
                    echo "pnpm not found, installing via npm..."
                    npm install -g pnpm@8
                  else
                    echo "pnpm available: $(pnpm --version)"
                  fi

            - name: Install frontend dependencies
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            - name: Run lint
              working-directory: frontend
              run: pnpm run lint

            - name: Check formatting
              working-directory: frontend
              run: pnpm run format:check

            - name: Run unit tests
              working-directory: frontend
              run: pnpm run test:unit

            - name: Run integration tests
              working-directory: frontend
              run: pnpm run test:integration

            - name: Run accessibility tests
              working-directory: frontend
              run: pnpm run test:a11y

            - name: Run performance benchmark (world-gen)
              working-directory: frontend
              run: pnpm run test:unit -- tests/perf/world-gen.bench.ts --run

            - name: Record benchmark output
              if: always()
              working-directory: frontend
              run: |
                  mkdir -p tests_output
                  # Run the bench once more and capture stdout to a timestamped file
                  pnpm run test:unit -- tests/perf/world-gen.bench.ts --run | tee tests_output/world-gen-bench-$(date +%s).log

            - name: Ensure artifact directory exists
              run: mkdir -p frontend/tests_output

            - name: Upload artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-artifacts
                  path: |
                      frontend/tests_output/failing-*.log
                      frontend/tests_output/*.xml
                      frontend/tests_output/*-counts.json

            - name: Upload CI marker on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: ci-marker
                  path: frontend/tests_output/ci-marker.txt
