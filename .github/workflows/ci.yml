name: CI

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-tests:
    name: Frontend lint + tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@8 || true

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          cd frontend
          pnpm run lint

      - name: Unit tests
        run: |
          cd frontend
          pnpm run test:unit

      - name: Integration tests
        run: |
          cd frontend
          pnpm run test:integration
name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Cache npm
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Install frontend dependencies
              working-directory: frontend
              run: |
                  if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
                    npm ci
                  else
                    npm install
                  fi

            - name: Run lint
              working-directory: frontend
              run: |
                  npm run lint

            - name: Check formatting
              working-directory: frontend
              run: |
                  npm run format:check

            - name: Run unit tests
              working-directory: frontend
              run: |
                  npm run test:unit

            - name: Run integration tests
              working-directory: frontend
              run: |
                  npm run test:integration

            - name: Run accessibility tests
              working-directory: frontend
              run: |
                  npm run test:a11y

            - name: Ensure artifact directory exists
              run: |
                  mkdir -p frontend/tests_output

            - name: Upload targeted artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-artifacts
                  path: |
                      frontend/tests_output/failing-*.log
                      frontend/tests_output/*.xml
                      frontend/tests_output/*-counts.json

            - name: Upload CI marker on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: ci-marker
                  path: frontend/tests_output/ci-marker.txt
