name: Generation Integration Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    generation-tests:
        name: Run generation integration tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ~/.pnpm-store
                  key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
                  restore-keys: pnpm-${{ runner.os }}-

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install frontend dependencies
              run: cd frontend && pnpm install --offline || pnpm install

            - name: Run frontend integration tests for generator
              run: pnpm --filter frontend run test:integration
              env:
                  CI: true
