name: Migration Tests

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies (frontend)
              working-directory: frontend
              run: npm ci

            - name: Run unit tests
              working-directory: frontend
              run: npm run test:unit

            - name: Run integration tests
              working-directory: frontend
              run: npm run test:integration

            - name: Run migration exporter (dry-run)
              run: |
                  chmod +x ./scripts/migrate-fixtures.sh || true
                  ./scripts/migrate-fixtures.sh

            - name: Upload migration reports
              uses: actions/upload-artifact@v4
              with:
                  name: migration-reports
                  path: |
                      specs/001-rework-data-models/migration-reports/**

            - name: Run accessibility tests
              working-directory: frontend
              run: npm run test:a11y

            - name: Check for perf tests
              id: perf_check
              run: |
                  # detect any perf test files under frontend/tests/perf
                  shopt -s nullglob 2>/dev/null || true
                  files=(frontend/tests/perf/*)
                  if [ ${#files[@]} -gt 0 ]; then
                    echo "found=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "found=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Run perf benchmark (migration 200 entities)
              if: steps.perf_check.outputs.found == 'true'
              working-directory: frontend
              run: |
                  # Measure wall-clock time for the perf test and fail if over SC-002 (3s)
                  THRESHOLD_MS=3000
                  START_MS=$(python - <<'PY'
import time
print(int(time.time()*1000))
PY
)
                  echo "Starting perf test at ${START_MS}ms"
                  npx vitest run tests/perf/load-200-entities.test.ts --run
                  END_MS=$(python - <<'PY'
import time
print(int(time.time()*1000))
PY
)
                  DURATION_MS=$((END_MS-START_MS))
                  echo "Perf test duration: ${DURATION_MS} ms"
                  if [ ${DURATION_MS} -gt ${THRESHOLD_MS} ]; then
                    echo "PERF FAILURE: migration dry-run exceeded SC-002 threshold (${THRESHOLD_MS} ms)"
                    exit 1
                  fi

            - name: Upload perf artifacts
              if: steps.perf_check.outputs.found == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: perf-artifacts
                  path: |
                      tests_output/**
